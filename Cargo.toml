[workspace]
resolver = "2"
members = ["crates/rules", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

# Bevy is slow unoptimized; our own crates stay quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
